# Sets the application name used by Spring Boot and related services.
spring.application.name=Student

# Specifies the PostgreSQL database connection URL:
# localhost = database server on this computer; 5432 = port; sms = database name.
spring.datasource.url=jdbc:postgresql://localhost:5432/sms

# Sets the PostgreSQL user account used to connect to the database.
spring.datasource.username=ziweigao

# Sets the password for the PostgreSQL user above.
# Left empty because the current local PostgreSQL configuration uses trust authentication.
spring.datasource.password=

# Tells Hibernate to update the database schema based on the JPA entity classes at startup.
# Applies supported schema changes, such as adding missing tables and columns.
spring.jpa.hibernate.ddl-auto=update
